services:
  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - rag-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 5

  rag-watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    container_name: rag-watcher
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_DB_HOST: rag-db
      RAG_DB_PORT: "5432"
      RAG_DB_USER: rag
      RAG_DB_PASSWORD: rag_local
      RAG_DB_NAME: rag
      RAG_STEERING_DIR: /watch
      RAG_POLL_INTERVAL: "10"
      RAG_EMBEDDING_MODEL: bge-m3
    volumes:
      - ../rag_steering:/watch:ro
    depends_on:
      rag-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag-data:
