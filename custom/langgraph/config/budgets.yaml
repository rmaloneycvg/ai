# Context Window Token Budget Configuration
#
# Local models: adaptive 8K-32K (configured per model in providers.yaml)
# External models: no hard limit (null = use model's reported max)
# All values configurable per-model via overrides section below.

# Default layer allocations as percentage of total context window.
# Protected layers are never compressed. Bounded layers trigger compression on overflow.
layers:
  system:
    type: protected
    percentage: 5       # ~400 tokens at 8K, ~1600 at 32K
    min_tokens: 300
  tools:
    type: bounded
    percentage: 12      # Tool schemas - compressed for weak models
    min_tokens: 500
  retrieved:
    type: bounded
    percentage: 35      # Steering docs, schemas, references
    min_tokens: 1000
  history:
    type: bounded
    percentage: 25      # Conversation history (rolling window + summarization)
    min_tokens: 500
  scratchpad:
    type: bounded
    percentage: 13      # Agent intermediate reasoning
    min_tokens: 300
  current_turn:
    type: protected
    percentage: 5       # User message (protected) + injected data (bounded)
    min_tokens: 200
  reserve:
    type: protected
    percentage: 5       # Output generation space
    min_tokens: 500

# Compression strategies per layer (triggered when layer exceeds allocation)
compression:
  history:
    strategy: rolling_window_with_summary
    keep_recent_turns: 4
    summary_max_tokens: 500
  retrieved:
    strategy: top_k_by_relevance
    max_documents: 5
    fallback_to_summary_tier: true
  scratchpad:
    strategy: keep_final_results
    prune_intermediate: true
  tools:
    strategy: phase_based_activation
    compress_descriptions: true
    max_tools_per_call: 8

# Per-model overrides
# max_context: null means unlimited (use model's reported window)
# max_context: <int> means hard cap regardless of model's reported window
overrides:
  # Local models - capped within 8K-32K range
  "llama3.1:8b":
    max_context: 8192
  "llama3.1:70b":
    max_context: 32768
  "qwen2.5:7b":
    max_context: 32768
  "qwen2.5:14b":
    max_context: 32768
  "mistral:7b":
    max_context: 8192
  "tinyllama":
    max_context: 2048
  "phi-2":
    max_context: 2048

  # External models - no limit (null)
  "gpt-4o":
    max_context: null
  "gpt-4o-mini":
    max_context: null
  "claude-sonnet-4-20250514":
    max_context: null
  "claude-haiku-3-20240307":
    max_context: null
