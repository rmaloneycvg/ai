[project]
name = "langgraph-workspace"
version = "0.1.0"
description = "Local LangGraph agent system for workspace artifact generation, optimized for local LLMs with adaptive context management and model-specific prompt compilation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "typer>=0.15",
    "uvicorn>=0.34",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (Ollama, etc.)",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E741", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
