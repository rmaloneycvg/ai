[project]
name = "mcp-scripts"
version = "0.1.0"
description = "MCP server scripts for postgres operations"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["postgres"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
