[project]
name = "git-workflow"
version = "0.1.0"
description = "Standardized Git workflow scripts for microservice monorepos with conventional commits"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.7",
    "rich==13.9.4",
]

[project.scripts]
git-commit = "src.commit:main"
git-branch = "src.branch:main"
git-prepare-pr = "src.prepare_pr:main"
git-merge-pr = "src.merge_pr:main"
git-hotfix = "src.hotfix:main"
git-promote = "src.promote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (creates real git repos in tmp_path)",
]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["src/lib"]
omit = ["tests/*", "src/lib/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
